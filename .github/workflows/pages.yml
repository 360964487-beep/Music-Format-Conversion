name: Build and deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/prepare-pwa.mjs'
      - 'scripts/pwa-dependencies.json'
      - 'tests/pwa.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qingzhuan-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify browser runtime
        run: node scripts/prepare-pwa.mjs
      - name: Test real WASM engine and PWA behavior
        run: node tests/pwa.test.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PWA
        id: deployment
        uses: actions/deploy-pages@v4
